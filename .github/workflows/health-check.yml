name: 说明书健康自检

# 每天凌晨4点（UTC=12:00北京时间）自动运行URL健康检查+自动修复
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装系统依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: 安装 Python 依赖
        run: python -m pip install --quiet --upgrade requests playwright pypdf pillow

      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium

      - name: URL健康检查+自动修复
        run: python crawl/healthcheck_urls.py

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.136.0 pages deploy dist --project-name=gongshuku --branch=main --commit-dirty=true

      - name: 回写修复后的采集清单
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crawl/*_manifest.json dist/data/health_report.json dist/data/docs-3.js 2>/dev/null || true
          git commit -m "chore(health): 自动健康检查+修复异常链接" || echo "无变更"
          git stash || true
          git pull --rebase origin main || true
          git stash pop || true
          git push origin main || (git pull --rebase origin main && git push origin main) || git push --force-with-lease origin main
