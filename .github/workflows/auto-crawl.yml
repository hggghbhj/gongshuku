name: 工书库自动采集

# 每3小时云端自动跑一次（cron为UTC，北京时间每3小时的17分）
# 支持手动触发
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装系统依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils ghostscript

      - name: 安装Python依赖
        run: python -m pip install --quiet --upgrade requests playwright pypdf

      - name: 安装Chromium
        run: python -m playwright install --with-deps chromium

      - name: 云端采集
        run: rm -f dist/data/stats.json && python crawl/cloud_crawl.py
        continue-on-error: true

      - name: 复制PDF到部署目录
        run: |
          mkdir -p dist/pdfs
          if [ -d crawl/pdfs ]; then
            cp -r crawl/pdfs/* dist/pdfs/ 2>/dev/null || true
          fi
          echo "PDF总数: $(find dist/pdfs -name '*.pdf' | wc -l)"

      - name: 匹配本地PDF路径
        run: cd crawl && python match_local.py || echo "match_local异常，继续"
        continue-on-error: true

      - name: 压缩并移出超25MB的PDF
        run: python crawl/compress_large.py
        continue-on-error: true

      - name: 确保stats.json存在
        run: python crawl/ensure_stats.py

      - name: 重建docs-3.js
        run: |
          cp dist/data/docs-3.js /tmp/docs3_backup.js || true
          cd crawl && python build_docs.py || true
          cd ..
          if [ -f crawl/docs-3.js ]; then
            OLD=$(grep -o '"pdf"' /tmp/docs3_backup.js 2>/dev/null | wc -l)
            NEW=$(grep -o '"pdf"' crawl/docs-3.js | wc -l)
            echo "旧条目=$OLD 新条目=$NEW"
            if [ "$NEW" -ge "$OLD" ]; then
              cp crawl/docs-3.js dist/data/docs-3.js
            else
              cp /tmp/docs3_backup.js dist/data/docs-3.js
            fi
          fi

      - name: 部署到Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.136.0 pages deploy dist --project-name=gongshuku --branch=main --commit-dirty=true
        continue-on-error: true

      - name: 验证线上部署
        run: |
          sleep 10
          curl -s https://gongshuku.pages.dev/data/stats.json | head -c 300

      - name: 回写采集清单
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crawl/*_manifest.json crawl/cloud_crawl_state.json dist/data/stats.json dist/data/docs-3.js 2>/dev/null || true
          git commit -m "chore(auto): 更新采集清单" || echo "无清单变更"
          git pull --rebase origin main || true
          git push origin main || echo "push失败，下次重试"
